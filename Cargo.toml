[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1-alpha"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/The1UNeed/Linux-Subsystem-for-Windows"

[workspace.dependencies]
lsw-proto = { path = "crates/lsw-proto" }
lsw-daemon = { path = "crates/lsw-daemon" }
lsw-installer = { path = "crates/lsw-installer" }
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "fs", "sync", "signal"] }
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3"
uuid = { version = "1.29.2", features = ["v4"] }
regex = "1.13.1"
sha2 = "0.11.1"
hex = "0.4.3"
hadris-iso = { version = "2.5", features = ["joliet"] }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
