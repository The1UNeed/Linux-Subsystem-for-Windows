[workspace]
resolver = "3"
members = ["crates/*"]
# lsw-app (GTK 4, libadwaita) and lsw-coherence (Wayland, xkbcommon) need
# Linux desktop libraries; build them explicitly
# (`cargo build --workspace`, as CI does) on Linux.
default-members = [
    "crates/lsw-proto",
    "crates/lsw-daemon",
    "crates/lsw-installer",
    "crates/lsw-cli",
    "crates/lsw-guest-agent",
]

[workspace.package]
version = "0.0.1-alpha"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/The1UNeed/Linux-Subsystem-for-Windows"

[workspace.dependencies]
lsw-proto = { path = "crates/lsw-proto" }
lsw-daemon = { path = "crates/lsw-daemon" }
lsw-installer = { path = "crates/lsw-installer" }
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "fs", "sync", "signal"] }
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3"
uuid = { version = "1.29.2", features = ["v4"] }
regex = "1.13.1"
sha2 = "0.11.1"
hex = "0.4.3"
hadris-iso = { version = "2.5", features = ["joliet"] }
png = "0.18"
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
async-channel = "2.5"
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p"] }
gtk = { package = "gtk4", version = "0.11" }
adw = { package = "libadwaita", version = "0.9" }
rustix = { version = "1.1", default-features = false, features = ["std", "net"] }
windows = "0.62"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
